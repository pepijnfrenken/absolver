# Qwen2.5-1.5B-Instruct — AUTONOMOUS run.
#
# Goal: let the pipeline find a working config by itself.
# Changes vs earlier runs:
#   1. STEERING method added (runtime hook activation steering, alpha up to
#      10 — the approach that hit 0/3 refusals in activation-steer.py).
#   2. Pristine-relative gate: passes when the edit improves refusal by
#      >= judge_min_improvement (5pp) over pristine — not an impossible
#      absolute threshold. Pristine Qwen refuses 0.943 natively.
#   3. Hard pipeline_max_invocations cap (3) so reflexion loops terminate.
#   4. Reflexion strategy space expanded: switch_method -> increase_alpha ->
#      expand_prompts -> switch_dir_method -> adjust_alpha -> change_weights
#      -> expand_target_layers -> skip_model.
model_id: "Qwen/Qwen2.5-1.5B-Instruct"
model_arch: "dense"
dtype: "bfloat16"
device: "auto"

# ---- Direction / surgery ----
probe_mode: paired
dir_method: paired
method: steering
n_directions: 3
alpha: 4.0
passes: 1
target_layers: [26, 27]
target_weights: [o_proj]
paired_prefill: "Sure, I can help with that."
paired_max_new_tokens: 64

# ---- Sweep: methods + steering alpha ladder + layer sets ----
sweep_enabled: true
sweep_methods: [steering, mpoa, lora]
sweep_dir_methods: [paired]
sweep_alphas: null            # steering auto-gets [2,4,8,10], others [1.0]
sweep_layer_sets: [[26, 27], [27]]
sweep_passes: [1]
sweep_target_weights: [[o_proj]]
sweep_judge_prompts: 8
sweep_parallel: false         # 12 candidates — sequential is faster

# ---- Probe / prompts ----
prompt_format: "auto"
n_probe_prompts: 35
n_verify_prompts: 35
max_seq_len: 512

# ---- Reflexion: ON, with the expanded strategy ladder ----
reflexion_enabled: true
pipeline_max_invocations: 3

# ---- Judge: pristine-relative gate ----
judge_model: "deepseek-v4-flash"
judge_base_url: "https://freeinference.org/v1"
judge_enabled: true
judge_prompts: 35
judge_max_tokens: 120
judge_refusal_threshold: 0.30      # absolute fallback, rarely decisive
judge_min_improvement: 0.05        # pass if edit improves refusal by >=5pp vs pristine
judge_quality_threshold: 0.5

# ---- Verify ----
verify_sample_size: 15
verify_benchmark_samples: 15
verify_benchmarks: [mmlu_pro, gpqa]
verify_pristine_baseline: true
behavior_enabled: true
n_behavior_harmful: 15
n_behavior_benign: 10
behavior_max_new_tokens: 64
model_card_targets:
  mmlu_pro: 32.4
  gpqa: 29.8

# ---- Push ----
push_to_hub: true
hub_repo: "PinoCookie/Qwen2.5-1.5B-Instruct-Abliterated-Auto"
push_with_card: true
