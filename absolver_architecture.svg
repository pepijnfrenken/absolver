<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Segoe UI', -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/></filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker>
    <marker id="arrd" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
    <marker id="arrg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#14b8a6"/></marker>
    <marker id="arrb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
  </defs>
  <rect width="1000" height="520" fill="url(#bg)" rx="14"/>

  <text x="500" y="36" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" letter-spacing="0.3">Absolver: LangGraph Abliteration Pipeline</text>

  <!-- ===== ARROWS (drawn first = behind boxes) ===== -->

  <!-- Main flow arrows (top row) -->
  <polyline points="122,100 145,100" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <polyline points="260,100 283,100" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <polyline points="398,100 421,100" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <polyline points="536,100 559,100" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <polyline points="674,100 697,100" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <polyline points="812,100 835,100" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Config arrow (from top-left into SUMMON) -->
  <polyline points="69,284 69,148" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrb)"/>

  <!-- Output arrow (from REBIRTH to top-right) -->
  <polyline points="925,260 925,284" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>

  <!-- VERIFY down to bottom row -->
  <polyline points="621,140 621,300" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
  <!-- From bottom of VERIFY to left (REFLEXION) -->
  <polyline points="621,300 69,300" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
  <!-- Up into REFLEXION -->
  <polyline points="69,300 69,268" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrd)"/>

  <!-- From VERIFY to RIGHT (REBIRTH) -->
  <polyline points="621,140 621,210 925,210" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
  <!-- Down into REBIRTH -->
  <polyline points="925,210 925,268" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrg)"/>

  <!-- Ouroboros loop (curved arc above the arrows) -->
  <path d="M 490 135 Q 555 120, 621 135" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,3" fill="none"/>
  <text x="556" y="118" text-anchor="middle" fill="#ec4899" font-size="8">↻ Ouroboros retry</text>

  <!-- ===== BOXES (drawn second = on top of arrows) ===== -->

  <!-- Top row -->
  <g filter="url(#shadow)">
    <rect x="14" y="66" width="108" height="68" rx="6" fill="#166534"/>
    <rect x="14" y="66" width="108" height="68" rx="6" fill="url(#bg)" opacity="0.15"/>
    <text x="68" y="94" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700">SUMMON</text>
    <text x="68" y="112" text-anchor="middle" fill="#bbf7d0" font-size="8">Load model</text>
    <text x="68" y="124" text-anchor="middle" fill="#bbf7d0" font-size="8">Detect arch</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="152" y="66" width="108" height="68" rx="6" fill="#1e3a5f"/>
    <text x="206" y="94" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="700">PROBE</text>
    <text x="206" y="112" text-anchor="middle" fill="#bfdbfe" font-size="8">Collect activations</text>
    <text x="206" y="124" text-anchor="middle" fill="#bfdbfe" font-size="8">Harm vs harmless</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="290" y="66" width="108" height="68" rx="6" fill="#854d0e"/>
    <text x="344" y="94" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="700">DISTILL</text>
    <text x="344" y="112" text-anchor="middle" fill="#fef9c3" font-size="8">Extract direction</text>
    <text x="344" y="124" text-anchor="middle" fill="#fef9c3" font-size="8">SVD / LEACE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="428" y="66" width="108" height="68" rx="6" fill="#991b1b"/>
    <text x="482" y="94" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">EXCISE</text>
    <text x="482" y="112" text-anchor="middle" fill="#fecaca" font-size="8">Project refusal</text>
    <text x="482" y="124" text-anchor="middle" fill="#fecaca" font-size="8">out of layer</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="566" y="66" width="110" height="68" rx="6" fill="#5b21b6"/>
    <text x="621" y="94" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700">VERIFY</text>
    <text x="621" y="112" text-anchor="middle" fill="#e9d5ff" font-size="8">Check refusal</text>
    <text x="621" y="124" text-anchor="middle" fill="#e9d5ff" font-size="8">rate dropped?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="704" y="66" width="108" height="68" rx="6" fill="#334155"/>
    <text x="758" y="94" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="700">JUDGE</text>
    <text x="758" y="112" text-anchor="middle" fill="#e2e8f0" font-size="8">LLM evaluates</text>
    <text x="758" y="124" text-anchor="middle" fill="#e2e8f0" font-size="8">quality score</text>
  </g>

  <!-- Bottom row -->
  <g filter="url(#shadow)">
    <rect x="14" y="275" width="108" height="60" rx="6" fill="#4c1d95"/>
    <text x="68" y="301" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">REFLEXION</text>
    <text x="68" y="318" text-anchor="middle" fill="#c4b5fd" font-size="8">Strategy ladder</text>
    <text x="68" y="328" text-anchor="middle" fill="#c4b5fd" font-size="8">Adjust &amp; retry</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="872" y="275" width="108" height="60" rx="6" fill="#0d6030"/>
    <text x="926" y="301" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="700">REBIRTH</text>
    <text x="926" y="318" text-anchor="middle" fill="#ccfbf1" font-size="8">Save to Hub</text>
    <text x="926" y="328" text-anchor="middle" fill="#ccfbf1" font-size="8">Restore weights</text>
  </g>

  <!-- ===== LABELS ON ARROWS ===== -->
  <text x="350" y="294" text-anchor="middle" fill="#94a3b8" font-size="8" font-style="italic">← fail — retry with adjusted params</text>
  <text x="780" y="206" text-anchor="middle" fill="#14b8a6" font-size="8" font-style="italic">pass →</text>

  <!-- ===== CONFIG INPUT BOX ===== -->
  <rect x="14" y="290" width="108" height="34" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="68" y="311" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">⚙️ YAML Config</text>

  <!-- ===== HF OUTPUT BOX ===== -->
  <rect x="872" y="290" width="108" height="34" rx="6" fill="#1e293b" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="926" y="311" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="600">🤗 HF Hub Model</text>

  <!-- ===== CLOUD BADGE ===== -->
  <rect x="370" y="370" width="260" height="34" rx="17" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500" y="392" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">☁️ Runs on Any Cloud GPU · Modal · Local</text>

  <!-- ===== LEGEND ===== -->
  <rect x="14" y="425" width="970" height="78" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="500" y="448" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">DIRECTIONAL METHODS</text>
  <rect x="40" y="458" width="110" height="24" rx="4" fill="#22c55e" opacity="0.15"/><text x="95" y="474" text-anchor="middle" fill="#22c55e" font-size="9">diff_means</text>
  <rect x="170" y="458" width="110" height="24" rx="4" fill="#3b82f6" opacity="0.15"/><text x="225" y="474" text-anchor="middle" fill="#3b82f6" font-size="9">PCA / SVD</text>
  <rect x="300" y="458" width="110" height="24" rx="4" fill="#f59e0b" opacity="0.15"/><text x="355" y="474" text-anchor="middle" fill="#f59e0b" font-size="9">LEACE</text>
  <rect x="430" y="458" width="110" height="24" rx="4" fill="#a855f7" opacity="0.15"/><text x="485" y="474" text-anchor="middle" fill="#a855f7" font-size="9">whitened_svd</text>
  <text x="500" y="494" text-anchor="middle" fill="#64748b" font-size="9">Dense · Mixture of Experts · Diffusion text encoders · Checkpoint resume</text>
</svg>
